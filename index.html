<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iPad Mini Home Dashboard</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050507; /* 更深邃的黑 */
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        .card {
            position: absolute;
            background-color: #121214;
            border-radius: 16px;
            box-sizing: border-box;
            padding: 20px;
            border: 1px solid #232326;
        }

        /* 左上：炫彩大時鐘格 (62% 高度) */
        .left-top {
            left: 2%;
            top: 4%;
            width: 46%;
            height: 62%;
            text-align: center;
            display: block;
        }
        .clock-container {
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            -webkit-transform: translateY(-50%); /* 相容 iOS 9 */
        }
        #date {
            font-size: 2.2rem; /* 字體加大 */
            color: #8e8e93;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        #time-box {
            font-size: 5rem; /* 超特大字體 */
            font-weight: bold;
            color: #30d158; 
            /* 霓虹綠發光特效，讓畫面生動不沉悶 */
            text-shadow: 0 0 12px rgba(48, 209, 88, 0.6), 0 0 25px rgba(48, 209, 88, 0.3);
            letter-spacing: -2px;
        }
        #ampm {
            font-size: 1.5rem;
            color: #545456;
            margin-left: 5px;
            font-weight: normal;
            text-shadow: none;
        }

        /* 左下：細格智慧家居 APP (26% 高度) */
        .left-bottom {
            left: 2%;
            top: 70%;
            width: 46%;
            height: 26%;
            padding: 10px;
        }
        .app-btn {
            float: left;
            width: 45%;
            height: 85%;
            margin: 2% 2.5%;
            background: linear-gradient(145deg, #1c1c1e, #2c2c2e); /* 漸層質感 */
            border-radius: 12px;
            text-decoration: none;
            color: white;
            text-align: center;
            border: 1px solid #3a3a3c;
        }
        .app-btn:active { background: #3a3a3c; }
        .app-icon { font-size: 2rem; display: block; margin-top: 6px; }
        .app-text { font-size: 0.9rem; font-weight: bold; color: #ffffff; display: block; margin-top: 4px; }

        /* 右上與右下：兩格完美平分 (各佔 44% 高度) */
        .right-top {
            left: 52%;
            top: 4%;
            width: 46%;
            height: 44%;
        }
        .right-bottom {
            left: 52%;
            top: 52%;
            width: 46%;
            height: 44%;
        }

        /* 天氣板塊排版 */
        .weather-title { font-size: 1.1rem; color: #aeaeb2; font-weight: bold; margin-bottom: 12px; }
        #current-temp { font-size: 3.5rem; font-weight: bold; color: #ff9500; float: left; width: 45%; text-align: center; }
        #current-cond { font-size: 1.3rem; color: #ffffff; font-weight: bold; margin-top: 8px; }
        #current-details { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
        
        .forecast-item { width: 100%; border-bottom: 1px solid #232326; padding: 8px 0; font-size: 0.95rem; clear: both; }
        .fc-day { float: left; width: 25%; color: #ffffff; font-weight: bold; }
        .fc-text { float: left; width: 45%; color: #ff9500; }
        .fc-temp { float: right; width: 30%; text-align: right; color: #aeaeb2; }
        .fc-high { color: #ff453a; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 左上：大時鐘（英式日期 + 霓虹效果） -->
    <div class="card left-top">
        <div class="clock-container">
            <div id="date">19 Sept</div>
            <div id="time-box"><span id="time">00:00</span><span id="ampm">AM</span></div>
        </div>
    </div>

    <!-- 左下：智慧家居 APP 按鈕（相容 iOS 9 最強語法） -->
    <div class="card left-bottom">
        <!-- 如果 App 開不起，請在 iPad 瀏覽器點擊，iOS 會彈出詢問是否開啟 -->
        <a href="homeassistant://app" class="app-btn">
            <span class="app-icon">🏠</span>
            <span class="app-text">HA</span>
        </a>
        <a href="ecovacs://main" class="app-btn">
            <span class="app-icon">🤖</span>
            <span class="app-text">Ecovacs</span>
        </a>
    </div>

    <!-- 右上：即時天氣（包含下雨/狀況顯示） -->
    <div class="card right-top">
        <div class="weather-title">即時天氣狀況</div>
        <div id="current-temp">--°</div>
        <div style="float: right; width: 55%;">
            <div id="current-cond">讀取中...</div>
            <div id="current-details">濕度: -- | 風速: --</div>
        </div>
    </div>

    <!-- 右下：一星期天氣預測（兩格均分） -->
    <div class="card right-bottom">
        <div class="weather-title">本週天氣預報</div>
        <div id="forecast-box">
            <div style="color:#aeaeb2; font-size:0.95rem;">正在更新預測...</div>
        </div>
    </div>

    <script>
        // 1. 英式日期與大時鐘邏輯
        var shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        function updateClock() {
            var now = new Date();
            
            // 設定英式日期格式: 19 Sept
            var dateStr = now.getDate() + " " + shortMonths[now.getMonth()];
            document.getElementById('date').innerText = dateStr;
            
            // 時間與補零
            var hours = now.getHours();
            var mins = now.getMinutes();
            var minutesStr = mins < 10 ? '0' + mins : mins;
            var ampmStr = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            document.getElementById('time').innerText = hours + ":" + minutesStr;
            document.getElementById('ampm').innerText = ampmStr;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // 2. 免阻擋全新天氣 API 讀取 (wttr.in)
        function getWeatherData() {
            // 讀取香港地區的 JSON 天氣數據
            fetch('https://wttr.in')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    // A. 即時天氣
                    var current = data.current_condition[0];
                    document.getElementById('current-temp').innerText = current.temp_C + "°";
                    
                    // 取得中文天氣狀態（例如：下雨、晴天）
                    if(current.lang_zh && current.lang_zh.length > 0) {
                        document.getElementById('current-cond').innerText = current.lang_zh[0].value;
                    } else {
                        document.getElementById('current-cond').innerText = current.weatherDesc[0].value;
                    }
                    document.getElementById('current-details').innerText = "濕度: " + current.humidity + "% | 風速: " + current.windspeedKmph + "km/h";

                    // B. 一週預測 (顯示接下來 3 天，完美填滿右下格)
                    var forecastBox = document.getElementById('forecast-box');
                    forecastBox.innerHTML = '';
                    
                    var daysOfWeek = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                    
                    for(var i = 1; i <= 3; i++) {
                        var fDay = data.weather[i];
                        var fDate = new Date(fDay.date);
                        var dayName = daysOfWeek[fDate.getDay()];
                        
                        // 預測的天氣狀況
                        var condText = "多雲";
                        if(fDay.hourly && fDay.hourly[4]) {
                            var midDay = fDay.hourly[4]; // 中午的天氣
                            condText = (midDay.lang_zh && midDay.lang_zh[0]) ? midDay.lang_zh[0].value : midDay.weatherDesc[0].value;
                        }
                        
                        var maxT = fDay.maxtempC;
                        var minT = fDay.mintempC;

                        var item = document.createElement('div');
                        item.className = 'forecast-item';
                        item.innerHTML = 
                            '<div class="fc-day">' + dayName + '</div>' +
                            '<div class="fc-text">' + condText + '</div>' +
                            '<div class="fc-temp"><span class="fc-high">' + maxT + '°</span> / ' + minT + '°</div>';
                        
                        forecastBox.appendChild(item);
                    }
                })
                .catch(function() {
                    document.getElementById('current-cond').innerText = "天氣連線稍候...";
                });
        }

        getWeatherData();
        setInterval(getWeatherData, 1800000); // 每 30 分鐘自動更新
    </script>
</body>
</html>
