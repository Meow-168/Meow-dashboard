<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智慧控制台">
  <title>iPad Fullscreen Siri Dashboard</title>

  <!-- Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* === 1. 基礎設定：全螢幕不留白、不允許滾動 === */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02040a;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      padding: 20px;
      position: relative;
    }

    /* === 2. 背景流光幻彩特效 === */
    .bg-glow-1 {
      position: absolute;
      top: -15%;
      left: -15%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
      filter: blur(70px);
      animation: floatGlow 14s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 1;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -15%;
      right: -15%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(0,0,0,0) 70%);
      filter: blur(70px);
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    /* === 3. 核心 4宮格網格佈局 === */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      width: 100%;
      height: 100%;
      z-index: 10;
      position: relative;
    }

    /* === 4. 毛玻璃面板與磁磚樣式（純 CSS 自體渲染） === */
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .glass-tile {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      transition: all 0.2s ease;
    }

    /* === 5. 左上角：特大時鐘與英式日期樣式 === */
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-tag {
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .tag-blue { color: #38bdf8; }
    .tag-sky { color: #0ea5e9; }
    .tag-purple { color: #c084fc; }
    .tag-amber { color: #fbbf24; }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.7rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .clock-center {
      margin-top: auto;
      margin-bottom: auto;
    }
    #dayOfWeek {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(to right, #fcd34d, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .time-row {
      display: flex;
      align-items: baseline;
      margin: 4px 0;
    }
    #clockDisplay {
      font-size: 4.8rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: -2px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    #ampmDisplay {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-left: 8px;
    }
    .date-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 800;
    }
    #britishDateDisplay { color: #fbbf24; }
    #fullDateSub { font-size: 0.85rem; color: #64748b; font-weight: normal; }

    .footer-text {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* === 6. 右上角：天氣視窗樣式 === */
    .weather-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      margin-top: auto;
      margin-bottom: auto;
    }
    .temp-big {
      font-size: 4.5rem;
      font-weight: 900;
      color: white;
      line-height: 1;
    }
    .temp-unit { font-size: 1.8rem; color: #38bdf8; font-weight: bold; }
    #weatherCondition { font-size: 1.1rem; font-weight: bold; color: #fbbf24; margin-top: 6px; }
    #currentHumidity { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }
    #weatherIconContainer { font-size: 4.5rem; text-align: center; color: #38bdf8; }
    
    .weather-float { animation: floatWeather 4s ease-in-out infinite; }
    @keyframes floatWeather {
      0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3)); }
      50% { transform: translateY(-6px); filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6)); }
    }
    #hkoWarningBox { color: #f87171; font-size: 0.75rem; font-weight: 600; }

    /* === 7. 左下角：Siri 幻彩發光按鈕樣式 === */
    .siri-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: auto;
      gap: 12px;
    }
    .siri-orb {
      width: 85px;
      height: 85px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #c084fc 0%, #3b82f6 40%, #ec4899 70%, #10b981 100%);
      background-size: 200% 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      animation: siriWave 6s infinite alternate linear;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5), 0 0 50px rgba(59, 130, 246, 0.3);
      transition: transform 0.2s ease;
    }
    .siri-orb:active { transform: scale(0.9); }
    .siri-orb i { color: white; font-size: 1.8rem; }
    
    @keyframes siriWave {
      0% { background-position: 0% 50%; transform: rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { background-position: 100% 50%; transform: rotate(360deg); }
    }
    .siri-title { font-size: 1rem; font-weight: 800; color: #e2e8f0; text-align: center; margin: 0; }
    .siri-sub { font-size: 0.75rem; color: #c084fc; text-align: center; margin: 2px 0 0 0; font-weight: 500; }

    /* === 8. 右下角：九天預報列表樣式 === */
    .forecast-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 85%;
    }
    .forecast-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
      font-size: 0.85rem;
    }
    .forecast-item:last-child { border-bottom: none; padding-bottom: 0; }
    .fc-date-box { display: flex; flex-direction: column; }
    .fc-day { font-weight: bold; color: #f1f5f9; }
    .fc-subdate { font-size: 0.65rem; color: #64748b; }
    
    .fc-badge {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: bold;
    }
    .badge-low { color: #94a3b8; background: rgba(148, 163, 184, 0.1); }
    .badge-mid { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); }
    .badge-high { color: #f87171; background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.2); }

    .fc-temp { font-weight: bold; }
    .fc-max { color: #f87171; }
    .fc-min { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- 4:3 完美全螢幕主網格 -->
  <main class="dashboard-grid">

    <!-- ==========================================
         1. 左上：大時鐘與英式日期板塊
         ========================================== -->
    <section class="glass-panel">
      <div class="title-row">
        <div class="header-tag tag-blue"><i class="fa-regular fa-clock"></i> Live Clock</div>
        <div class="badge"><span style="background:#4ade80; width:6px; height:6px; display:inline-block; border-radius:50%; margin-right:4px;"></span>iPad Active</div>
      </div>

      <div class="clock-center">
        <div id="dayOfWeek">SATURDAY</div>
        <div class="time-row">
          <h1 id="clockDisplay">00:00</h1>
          <span id="ampmDisplay">PM</span>
        </div>
        <div class="date-row">
          <i class="fa-solid fa-calendar-day" style="color:#38bdf8; font-size:1.2rem;"></i>
          <span id="britishDateDisplay">19 SEPT</span>
          <span id="fullDateSub">/ 2026</span>
        </div>
      </div>

      <div class="footer-text">
        <span>System Stable</span>
        <span>HKT (UTC+8)</span>
      </div>
    </section>

    <!-- ==========================================
         2. 右上：香港天文台即時天氣板塊
         ========================================== -->
    <section class="glass-panel">
      <div class="title-row">
