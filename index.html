<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="智慧家居控制">
    <title>Modern iPad Home Dashboard</title>
    
    <style>
        /* 現代 iOS 頂級暗黑控制台風格 */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #08080a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 2x2 網格佈局：完全填滿 iPad 螢幕 */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1.2fr 0.8fr; /* 時鐘大格，App 細格 */
            gap: 25px;
            width: 100%;
            height: 100%;
            padding: 40px 25px 25px 25px; /* 頂部留空給 iOS 狀態列 */
            box-sizing: border-box;
        }

        /* 精緻卡片設計（毛玻璃微光質感） */
        .card {
            background-color: #16161a;
            border-radius: 20px;
            border: 1px solid #282830;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* 左上：炫彩霓虹大時鐘 */
        .time-box {
            align-items: center;
            background: linear-gradient(145deg, #111115, #1a1a22);
        }
        #date {
            font-size: 2.2rem;
            color: #a1a1aa;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .clock-display {
            display: flex;
            align-items: baseline;
        }
        #time {
            font-size: 6rem; /* 現代螢幕特大字體 */
            font-weight: 700;
            color: #30d158; /* 蘋果綠 */
            letter-spacing: -2px;
            /* 進階多層發光效果 */
            text-shadow: 0 0 15px rgba(48, 209, 88, 0.5), 0 0 30px rgba(48, 209, 88, 0.2);
        }
        #ampm {
            font-size: 1.8rem;
            color: #52525b;
            margin-left: 10px;
            font-weight: 600;
        }

        /* 左下：細格智慧家居 APP（緊湊排版） */
        .apps-box {
            justify-content: space-between;
        }
        .section-title {
            font-size: 1.2rem;
            color: #a1a1aa;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
        }
        .app-btn {
            background: linear-gradient(135deg, #22222a, #2a2a35);
            border: 1px solid #3f3f46;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .app-btn:active {
            transform: scale(0.96);
            background: #3f3f46;
        }
        .app-icon { font-size: 2.2rem; }
        .app-text { font-size: 1rem; font-weight: bold; }

        /* 右上與右下：兩格均分的天氣區塊 */
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        #hk-temp {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
        }
        .weather-info {
            display: flex;
            flex-direction: column;
        }
        #hk-weather-text {
            font-size: 1.6rem;
            color: #ff9500; /* 亮橘色 */
            font-weight: bold;
            margin-bottom: 6px;
        }
        #hk-humidity {
            font-size: 1.1rem;
            color: #a1a1aa;
        }
        #hk-warning {
            font-size: 1rem;
            color: #ff453a;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }

        /* 天氣預報列表排版 */
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        .forecast-item {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            font-size: 1.1rem;
            border-bottom: 1px solid #282830;
            padding-bottom: 8px;
        }
        .forecast-item:last-child { border-bottom: none; }
        .fc-day { font-weight: bold; color: #ffffff; }
        .fc-text { color: #ff9500; font-size: 1.05rem; }
        .fc-temp { text-align: right; color: #a1a1aa; }
        .fc-high { color: #ff453a; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 左上：大時鐘（英式日期 + 霓虹綠效果） -->
        <div class="card time-box">
            <div id="date">19 Sept</div>
            <div class="clock-display">
                <span id="time">00:00</span>
                <span id="ampm">AM</span>
            </div>
        </div>

        <!-- 右上：香港天文台即時天氣 -->
        <div class="card">
            <div class="section-title" style="margin-bottom: 5px;">香港地區即時天氣</div>
            <div class="weather-main">
                <div id="hk-temp">--°</div>
                <div class="weather-info">
                    <div id="hk-weather-text">正在連線...</div>
                    <div id="hk-humidity">相對濕度: --%</div>
                </div>
            </div>
            <div id="hk-warning"></div>
        </div>

        <!-- 左下：細格智慧家居 APP（支援現代 iOS 跳轉） -->
        <div class="card apps-box">
            <div class="section-title">快捷面板控制</div>
            <div class="app-grid">
                <a href="homeassistant://" class="app-btn">
                    <span class="app-icon">🏠</span>
                    <span class="app-text">Home Assistant</span>
                </a>
                <a href="ecovacs://" class="app-btn">
                    <span class="app-icon">🤖</span>
                    <span class="app-text">Ecovacs Home</span>
                </a>
            </div>
        </div>

        <!-- 右下：香港天文台一星期預測 -->
        <div class="card">
            <div class="section-title">香港九天天氣預報</div>
            <div class="forecast-list" id="hk-forecast-box">
                <div style="color:#a1a1aa; font-size:1.1rem;">正在讀取天文台數據...</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 現代系統專用時鐘邏輯（英式日期 19 Sept）
        const shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        function updateClock() {
            const now = new Date();
            
            // 設定英式日期格式: 19 Sept
            document.getElementById('date').innerText = now.getDate() + " " + shortMonths[now.getMonth()];
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            document.getElementById('time').innerText = `${hours}:${minutes}`;
            document.getElementById('ampm').innerText = ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // 2. 香港天文台官方 API 直接串接（無跨域阻擋問題）
        function getHKOWeather() {
            const currentUrl = 'https://weather.gov.hk';
            const forecastUrl = 'https://weather.gov.hk';

            // A. 讀取即時溫度與下雨狀況
            fetch(currentUrl)
                .then(res => res.json())
                .then(data => {
                    if(data.temperature && data.temperature.data) {
                        document.getElementById('hk-temp').innerText = `${data.temperature.data[0].value}°`;
                    }
                    if(data.humidity && data.humidity.data) {
                        document.getElementById('hk-humidity').innerText = `相對濕度: ${data.humidity.data[0].value}%`;
                    }
                    
                    // 從天文台的天氣照片或文字報告中自動識別當前狀態（下雨、晴天等）
                    let conditionText = "多雲";
                    if (data.rainfall && data.rainfall.data && data.rainfall.data[0].max > 0) {
                        conditionText = "有雨";
                    } else if (data.icon && data.icon[0]) {
                        // 簡單將天文台圖標轉換為常用文字
                        const icon = data.icon[0];
                        if (icon >= 50 && icon <= 54) conditionText = "有雨";
                        else if (icon >= 62 && icon <= 65) conditionText = "少雲/晴朗";
                        else conditionText = "陰天/多雲";
                    }
                    document.getElementById('hk-weather-text').innerText = conditionText;

                    // 天氣警告摘要
                    const warningBox = document.getElementById('hk-warning');
                    if(data.warningMessage && data.warningMessage.length > 0) {
                        warningBox.innerText = `⚠️ ${data.warningMessage[0]}`;
                    } else {
                        warningBox.innerText = "✅ 當前無任何天氣警告";
                    }
                })
                .catch(() => {
                    document.getElementById('hk-weather-text').innerText = "連線稍候...";
                });

            // B. 讀取九天天氣預報（精選 4 天，完美填滿右下格）
            fetch(forecastUrl)
                .then(res => res.json())
                .then(data => {
                    if(data.weatherForecast) {
