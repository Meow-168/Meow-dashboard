<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智慧控制台">
  <title>iPad Fullscreen Siri Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02040a;
      color: #f3f4f6;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Ambient Background FX */
    .bg-glow-1 {
      position: absolute;
      top: -15%;
      left: -15%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
      filter: blur(70px);
      animation: floatGlow 14s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -15%;
      right: -15%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(0,0,0,0) 70%);
      filter: blur(70px);
      animation: floatGlow 18s infinite alternate-reverse ease-in-out;
      pointer-events: none;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(13, 20, 38, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .glass-tile {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-tile:active {
      transform: scale(0.96);
      background: rgba(51, 65, 85, 0.6);
    }

    /* Siri Orb Wave Glowing Style */
    .siri-glow-panel {
      background: radial-gradient(circle at center, rgba(147, 51, 234, 0.1) 0%, rgba(59, 130, 246, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
    }

    .siri-orb {
      background: linear-gradient(135deg, #a855f7 0%, #3b82f6 40%, #ec4899 70%, #10b981 100%);
      background-size: 200% 200%;
      animation: siriWave 6s infinite alternate linear;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), 0 0 70px rgba(59, 130, 246, 0.4);
    }

    @keyframes siriWave {
      0% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(180deg); blur: 2px; }
      100% { background-position: 100% 50%; transform: scale(1) rotate(360deg); }
    }

    .neon-text-blue {
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
    }

    .font-mono-clock {
      font-family: 'JetBrains Mono', monospace;
    }

    .weather-float {
      animation: floatWeather 4s ease-in-out infinite;
    }
    @keyframes floatWeather {
      0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
      50% { transform: translateY(-6px) scale(1.03); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.7)); }
    }
  </style>
</head>
<body class="w-full h-full p-3 md:p-4 relative overflow-hidden select-none">

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- 4:3 完美全螢幕主容器網格 -->
  <main class="w-full h-full grid grid-cols-2 grid-rows-2 gap-3.5 md:gap-5 z-10 relative">

    <!-- ==========================================
         1. TOP-LEFT: LARGE CLOCK & BRITISH DATE
         ========================================== -->
    <section class="glass-panel rounded-3xl p-5 md:p-7 flex flex-col justify-between relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2 text-cyan-400 font-bold text-xs tracking-wider uppercase">
          <i class="fa-regular fa-clock text-sm"></i>
          <span>Live Clock</span>
        </div>
        <div class="glass-tile px-3 py-1 rounded-full text-[11px] text-slate-300 flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-medium tracking-wide">iPad Pro Display</span>
        </div>
      </div>

      <div class="my-auto">
        <div id="dayOfWeek" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-amber-500 tracking-wider uppercase">
          SATURDAY
        </div>

        <div class="flex items-baseline space-x-2 sm:space-x-3 my-1">
          <h1 id="clockDisplay" class="text-6xl sm:text-7xl md:text-8xl font-black font-mono-clock tracking-tight text-white neon-text-blue">
            00:00
          </h1>
          <span id="ampmDisplay" class="text-2xl sm:text-3xl font-extrabold text-cyan-400 font-mono-clock">
            PM
          </span>
        </div>

        <div class="flex items-center space-x-2.5 text-2xl sm:text-3xl font-black text-slate-200">
          <i class="fa-solid fa-calendar-day text-cyan-400 text-xl"></i>
          <span id="britishDateDisplay" class="text-amber-300 font-mono-clock">19 SEPT</span>
          <span id="fullDateSub" class="text-sm font-normal text-slate-400">/ 2026</span>
        </div>
      </div>

      <div class="flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-800/80 pt-3">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>System Stable</span>
        </span>
        <span class="font-mono text-slate-500">HKT (UTC+8)</span>
      </div>
    </section>

    <!-- ==========================================
         2. TOP-RIGHT: REAL-TIME WEATHER (HKO)
         ========================================== -->
    <section class="glass-panel rounded-3xl p-5 md:p-7 flex flex-col justify-between relative overflow-hidden">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2 text-sky-400 font-bold text-xs tracking-wider uppercase">
          <i class="fa-solid fa-location-dot"></i>
          <span id="locationName" class="text-slate-200">Hong Kong Observatory</span>
        </div>
        <div class="text-[10px] bg-sky-500/10 text-sky-400 px-2.5 py-0.5 rounded-full border border-sky-500/20 font-mono">Live API</div>
      </div>

      <div class="grid grid-cols-2 gap-2 my-auto items-center">
        <div class="flex flex-col">
          <div class="flex items-start">
            <span id="currentTemp" class="text-6xl sm:text-7xl font-black text-white tracking-tight">--</span>
            <span class="text-3xl font-bold text-sky-400 mt-1">°C</span>
          </div>
          <div id="weatherCondition" class="text-base md:text-lg font-bold text-amber-400 mt-1">取得數據中...</div>
          <div id="currentHumidity" class="text-xs md:text-sm text-slate-400 mt-0.5">相對濕度: --%</div>
        </div>
        <div class="flex justify-center items-center">
          <div id="weatherIconContainer" class="text-6xl sm:text-7xl md:text-8xl text-sky-400 weather-float">
            <i class="fa-solid fa-cloud-sun"></i>
          </div>
        </div>
      </div>

      <div id="hkoWarningBox" class="text-xs font-semibold text-rose-400 border-t border-slate-800/80 pt-3 flex items-center gap-1.5 truncate">
        <i class="fa-solid fa-triangle-exclamation animate-pulse"></i> 正在檢查特別天氣警告...
      </div>
    </section>

    <!-- ==========================================
         3. BOTTOM-LEFT: APPLE SIRI INTERFACE
         ========================================== -->
    <section class="glass-panel rounded-3xl p-5 md:p-7 flex flex-col justify-between relative overflow-hidden siri-glow-panel">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2 text-purple-400 font-bold text-xs tracking-wider uppercase">
          <i class="fa-solid fa-microphone-lines text-sm"></i>
          <span>Apple Siri Assistant</span>
        </div>
        <div class="text-[10px] bg-purple-500/10 text-purple-400 px-2.5 py-0.5 rounded-full border border-purple-500/20 font-mono">Voice Core</div>
      </div>

      <!-- Center Siri Orb Trigger -->
      <div class="my-auto flex flex-col items-center justify-center gap-4">
        <!-- 喚醒 Apple 原生捷徑/Siri 機制的觸發通道 -->
        <a href="shortcuts://" class="w-24 h-24 rounded-full siri-orb flex items-center justify-center group active:scale-90 transition duration-300">
          <i class="fa-solid fa-microphone text-white text-3xl group-hover:scale-110 transition"></i>
        </a>
        <div class="text-center">
          <h2 class="text-base font-extrabold text-slate-200 tracking-wide">Tap to Speak</h2>
